<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <style>
      html, body, #root { background: #0E1728; margin: 0; padding: 0; min-height: 100%; }
    </style>
    <script>
      /* נצבע לפני הצביעה הראשונה. בלי זה, מי שבחר מצב בהיר רואה הבזק כהה
         בכל טעינה, כי React מעדכן את זה רק אחרי ה-mount. */
      try {
        if (localStorage.getItem("wx-theme") === "light") {
          document.documentElement.style.background = "#F2F6FC";
          document.addEventListener("DOMContentLoaded", function () {
            document.body.style.background = "#F2F6FC";
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#F2F6FC");
          });
        }
      } catch (e) { /* private mode */ }
    </script>

    <title>modelspread.app — Weather Model Comparison</title>
    <meta name="description" content="Compare seven global weather models side by side, and see which one has actually been right at your location." />

    <!-- גופנים מקומיים ולא מ-fonts.googleapis.com: הטענה מהשרתים של גוגל
         שולחת את כתובת ה-IP של כל מבקר אליהם, וזו העברת מידע אישי לצד
         שלישי בלי ידיעתו. IBM Plex ברישיון OFL ולכן מותר לארח אותו. -->
    <link rel="stylesheet" href="/fonts.css" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#0E1728" />
    <meta name="apple-mobile-web-app-title" content="ModelSpread" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:title" content="Model Spread — Weather Model Comparison" />
    <meta property="og:description" content="Seven global weather models, one place, and a scorecard for who's actually right." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ספירת ביקורים. Cloudflare Web Analytics ולא Google Analytics: בלי
         עוגיות, בלי מזהה קבוע ובלי יכולת לעקוב לאתרים אחרים, ולכן גם בלי
         צורך בבאנר הסכמה. יושב כאן בריפו ולא כהזרקה בממשק של Netlify,
         כדי שמה שרץ אצל המבקרים יהיה גלוי בקוד. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "38290206b45e4c8b967701addd6f54f3"}'></script>
  </body>
</html>
